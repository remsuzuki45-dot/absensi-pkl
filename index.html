<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi PKL Agustus 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Sticky Column Khusus Tampilan Desktop/PC agar tidak bertabrakan di HP */
        @media (min-width: 768px) {
            .sticky-col-1 { position: sticky; left: 0; z-index: 20; }
            .sticky-col-2 { position: sticky; left: 48px; z-index: 20; }
            .sticky-col-3 { position: sticky; left: 168px; z-index: 20; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-4 md:py-8 px-2 md:px-4">

    <div class="max-w-7xl mx-auto space-y-4 md:space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-lg md:text-2xl font-bold text-slate-900 uppercase tracking-tight">DAFTAR HADIR SISWA PRAKTIK KERJA LAPANGAN (PKL)</h1>
                <p class="text-sm md:text-base text-rose-600 font-bold mt-1">BULAN AGUSTUS 2026 (ONLINE & SINKRON)</p>
            </div>
            <div class="w-full md:w-auto text-center md:text-right bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-100">
                <div id="liveClock" class="text-lg md:text-xl font-bold text-indigo-600">--:--:--</div>
                <div id="liveDate" class="text-xs font-medium text-slate-500">----</div>
            </div>
        </div>

        <!-- Form Absen Siswa -->
        <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200 max-w-4xl mx-auto">
            <h2 class="text-base md:text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-check text-indigo-600"></i> Form Presensi Kehadiran
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs md:text-sm font-medium text-slate-700 mb-1">Cari / Pilih Nama Siswa:</label>
                    <select id="selectSiswa" onchange="updateSekolah()" class="w-full px-3 md:px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition bg-white">
                        <option value="">-- Pilih Nama Siswa --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs md:text-sm font-medium text-slate-700 mb-1">Asal Sekolah:</label>
                    <input type="text" id="asalSekolah" placeholder="Terisi otomatis..." readonly class="w-full px-3 md:px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 font-medium text-sm cursor-not-allowed">
                </div>
            </div>

            <!-- Tombol Absen -->
            <div class="space-y-3 mt-5">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Pilih Status Presensi:</label>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <button onclick="catatAbsen('IN')" class="py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Absen MASUK (IN)
                    </button>
                    <button onclick="catatAbsen('OUT')" class="py-3 px-4 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-semibold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Absen KELUAR (OUT)
                    </button>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="catatAbsen('IZIN')" class="py-2.5 px-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-semibold text-xs md:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-envelope"></i> Izin
                    </button>
                    <button onclick="catatAbsen('SAKIT')" class="py-2.5 px-2 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-semibold text-xs md:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-notes-medical"></i> Sakit
                    </button>
                    <button onclick="catatAbsen('DISPEN')" class="py-2.5 px-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-xs md:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-briefcase"></i> Dispen
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabel Rekapitulasi -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 md:p-5 border-b border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div>
                    <h2 class="text-base md:text-lg font-semibold text-slate-800">Matriks Rekapitulasi Presensi Agustus 2026</h2>
                    <p class="text-xs text-slate-500 mt-0.5" id="loadingStatus">Memuat data dari Google Sheets...</p>
                </div>
                <button onclick="muatDataOnline()" class="w-full sm:w-auto justify-center px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold text-xs md:text-sm rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Refresh Data
                </button>
            </div>

            <!-- Wrapper Scroll Tabel -->
            <div class="overflow-x-auto max-h-[600px] w-full">
                <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                    <thead>
                        <tr id="rowHeaderTanggal" class="bg-amber-100 text-slate-800 font-bold border-b border-slate-300 text-center">
                            <th class="py-3 px-2 border-r border-slate-300 w-10 bg-amber-100 sticky-col-1" rowspan="2">NO</th>
                            <th class="py-3 px-3 border-r border-slate-300 text-left min-w-[120px] bg-amber-100 sticky-col-2" rowspan="2">NAMA</th>
                            <th class="py-3 px-3 border-r border-slate-300 text-left min-w-[110px] bg-amber-100 sticky-col-3" rowspan="2">ASAL SEKOLAH</th>
                        </tr>
                        <tr id="rowHeaderInOut" class="bg-slate-100 text-slate-700 font-semibold text-center border-b border-slate-300">
                        </tr>
                    </thead>
                    <tbody id="tabelSiswa" class="divide-y divide-slate-200 text-slate-700">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVkmA3Ab_PELF36gNbF6OzS5jg7K8hvhtlD1PPQVseJey_2CXmERLHfrKGMHKusVou5g/exec";

   const masterSiswa = [
            { no: 1, nama: "Aqil", sekolah: "Smk 11" },
            { no: 2, nama: "Rafik", sekolah: "Smk 11" },
            { no: 3, nama: "Fahrizal", sekolah: "Smk 11" },
            { no: 4, nama: "Fhazal", sekolah: "Smk 11" },
            { no: 5, nama: "Fasha", sekolah: "Smk 11" },
            { no: 6, nama: "Diaz", sekolah: "Smk 11" },
            { no: 7, nama: "Aaron", sekolah: "Smk saron" },
            { no: 8, nama: "Jessica A", sekolah: "Smk saron" },
            { no: 9, nama: "Chika", sekolah: "Smk saron" },
            { no: 10, nama: "Michelle", sekolah: "Smk saron" },
            { no: 11, nama: "Dirga", sekolah: "Smk Gama" },
            { no: 12, nama: "Bagus", sekolah: "Smk Gama" },
            { no: 13, nama: "Feby", sekolah: "Smk Gama" },
            { no: 14, nama: "Mikel", sekolah: "Smk Gama" },
            { no: 15, nama: "Ardi", sekolah: "Smk Gama" },
            { no: 16, nama: "Padil", sekolah: "Smk Gama" },
            { no: 17, nama: "Sarah", sekolah: "Smk Gama" },
            { no: 18, nama: "Fatiyah", sekolah: "Smk Gama" },
            { no: 19, nama: "Alfiano", sekolah: "Smk 5" },
            { no: 20, nama: "Reza", sekolah: "Smk 5" },
            { no: 21, nama: "Afrizal", sekolah: "Smk 5" },
            { no: 22, nama: "Naufal", sekolah: "Smk 5" },
            { no: 23, nama: "Ulul Azmi", sekolah: "Smk 5" },
            { no: 24, nama: "Devin Velano", sekolah: "Smk Setia Bakti" },
            { no: 25, nama: "Alfisyahrin Baarigh", sekolah: "SMKS Bina Insani" },
            { no: 26, nama: "Wilyansyah", sekolah: "SMKS Bina Insani" },
            { no: 27, nama: "Andri", sekolah: "SMKS Bina Insani" },
            { no: 28, nama: "Rayhan", sekolah: "SMKS Bina Insani" }
        ];

        function generateDaftarTanggalAgustus() {
            const listTanggal = [];
            for (let day = 1; day <= 31; day++) {
                const date = new Date(2026, 7, day);
                if (date.getDay() !== 0) { 
                    listTanggal.push(`${String(day).padStart(2, '0')}/08/2026`);
                }
            }
            return listTanggal;
        }

        const daftarTanggal = generateDaftarTanggalAgustus();
        let databaseAbsensi = {};

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('liveDate').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function buildTableHeader() {
            const rowHeaderTanggal = document.getElementById('rowHeaderTanggal');
            const rowHeaderInOut = document.getElementById('rowHeaderInOut');

            daftarTanggal.forEach(tgl => {
                const thTgl = document.createElement('th');
                thTgl.className = "py-2 px-2 border-r border-b border-slate-300 min-w-[100px]";
                thTgl.colSpan = 2;
                thTgl.textContent = tgl;
                rowHeaderTanggal.appendChild(thTgl);

                const thIn = document.createElement('th');
                thIn.className = "py-1.5 px-2 border-r border-slate-300 bg-emerald-100/60 text-emerald-800 w-12";
                thIn.textContent = "IN";

                const thOut = document.createElement('th');
                thOut.className = "py-1.5 px-2 border-r border-slate-300 bg-rose-100/60 text-rose-800 w-12";
                thOut.textContent = "OUT";

                rowHeaderInOut.appendChild(thIn);
                rowHeaderInOut.appendChild(thOut);
            });
        }

        function initDropdown() {
            const select = document.getElementById('selectSiswa');
            select.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
            masterSiswa.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.no;
                opt.textContent = `${s.no}. ${s.nama} (${s.sekolah})`;
                select.appendChild(opt);
            });
        }

        function updateSekolah() {
            const idSelected = document.getElementById('selectSiswa').value;
            const inputSekolah = document.getElementById('asalSekolah');
            if (idSelected) {
                const siswa = masterSiswa.find(s => s.no == idSelected);
                inputSekolah.value = siswa ? siswa.sekolah : '';
            } else {
                inputSekolah.value = '';
            }
        }

        function getTglHariIniFormat() {
            const now = new Date();
            return `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
        }

        async function muatDataOnline() {
            document.getElementById('loadingStatus').innerText = "Mengambil data terbaru...";
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                databaseAbsensi = {};
                data.forEach(row => {
                    const [no, nama, sekolah, tanggal, jam, status] = row;
                    if (!databaseAbsensi[no]) databaseAbsensi[no] = {};
                    if (!databaseAbsensi[no][tanggal]) databaseAbsensi[no][tanggal] = { in: '-', out: '-' };

                    if (status === 'IN') databaseAbsensi[no][tanggal].in = jam;
                    else if (status === 'OUT') databaseAbsensi[no][tanggal].out = jam;
                    else {
                        databaseAbsensi[no][tanggal].in = status;
                        databaseAbsensi[no][tanggal].out = status;
                    }
                });

                renderTabel();
                document.getElementById('loadingStatus').innerText = "Data ter-update otomatis (Google Sheets)";
            } catch (err) {
                document.getElementById('loadingStatus').innerText = "Gagal memuat data / Belum set URL Google Script";
            }
        }

        async function catatAbsen(status) {
            const idSelected = document.getElementById('selectSiswa').value;
            if (!idSelected) {
                alert('Silakan pilih nama siswa terlebih dahulu!');
                return;
            }

            const tglHariIni = getTglHariIniFormat();
            const siswa = masterSiswa.find(s => s.no == idSelected);
            const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            document.getElementById('loadingStatus').innerText = "Mengirim data ke server...";

            const payload = {
                no: siswa.no,
                nama: siswa.nama,
                sekolah: siswa.sekolah,
                tanggal: tglHariIni,
                jam: jam,
                status: status
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                document.getElementById('selectSiswa').value = '';
                document.getElementById('asalSekolah').value = '';
                alert(`Berhasil! Presensi [${status}] terkirim untuk ${siswa.nama}`);
                muatDataOnline();
            } catch (err) {
                alert("Gagal menyimpan data ke server. Periksa koneksi internet.");
            }
        }

        function renderTabel() {
            const tbody = document.getElementById('tabelSiswa');
            tbody.innerHTML = '';

            masterSiswa.forEach(siswa => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-200";

                let rowHtml = `
                    <td class="py-2 px-2 text-center border-r border-slate-200 font-semibold text-slate-500 bg-white sticky-col-1">${siswa.no}</td>
                    <td class="py-2 px-3 font-semibold text-slate-900 border-r border-slate-200 bg-white sticky-col-2">${siswa.nama}</td>
                    <td class="py-2 px-3 text-slate-600 border-r border-slate-200 bg-white sticky-col-3">${siswa.sekolah}</td>
                `;

                daftarTanggal.forEach(tgl => {
                    const record = (databaseAbsensi[siswa.no] && databaseAbsensi[siswa.no][tgl]) 
                        ? databaseAbsensi[siswa.no][tgl] 
                        : { in: '-', out: '-' };

                    if (['IZIN', 'SAKIT', 'DISPEN'].includes(record.in)) {
                        let colorStyle = 'bg-amber-100 text-amber-800 font-bold';
                        if (record.in === 'SAKIT') colorStyle = 'bg-orange-100 text-orange-800 font-bold';
                        if (record.in === 'DISPEN') colorStyle = 'bg-blue-100 text-blue-800 font-bold';

                        rowHtml += `<td colspan="2" class="py-2 px-2 text-center border-r border-slate-200 ${colorStyle}">${record.in}</td>`;
                    } else {
                        let inClass = record.in !== '-' ? 'text-emerald-700 font-bold bg-emerald-50' : 'text-slate-400';
                        let outClass = record.out !== '-' ? 'text-rose-700 font-bold bg-rose-50' : 'text-slate-400';

                        rowHtml += `
                            <td class="py-2 px-2 text-center border-r border-slate-200 ${inClass}">${record.in}</td>
                            <td class="py-2 px-2 text-center border-r border-slate-200 ${outClass}">${record.out}</td>
                        `;
                    }
                });

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        buildTableHeader();
        initDropdown();
        muatDataOnline();
    </script>
</body>
</html>
